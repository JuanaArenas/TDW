<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web</title>
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/carrusel.css') }}" rel="stylesheet">

</head>

<body class="">
    <!--chatbot-->
    <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-4">
        <h2 class="text-xl font-bold mb-4 text-center text-blue-600">Chat Educativo</h2>
        <div id="chat" class="h-64 overflow-y-auto border p-2 mb-4 bg-gray-50 rounded"></div>
        <div class="flex">
            <input id="message" type="text" class="flex-grow border rounded-l px-2 py-1"
                placeholder="Escribe tu mensaje...">
            <button onclick="sendMessage()" class="bg-blue-500 text-white px-4 py-1 rounded-r">Enviar</button>
        </div>
        <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    </div>
    <!--Fin chatbot-->


    <!--menu desplegable-->
    <div class="">
        <nav class="px-4 py-4 sm:flex sm:items-center sm:justify-between bg-sky-500 hover:bg-sky-700">
            <section class="flex justify-between">
                <button class="text-gray-700 sm:hidden">
                    <svg class="w-6 h-6 fill-current" x="0px" y="0px" width="100" height="100" viewBox="0 0 50 50">
                        <!--ícono de "hamburguesa" o "menú"-->
                        <path
                            d="M 0 7.5 L 0 12.5 L 50 12.5 L 50 7.5 Z M 0 22.5 L 0 27.5 L 50 27.5 L 50 22.5 Z M 0 37.5 L 0 42.5 L 50 42.5 L 50 37.5 Z">
                        </path>
                        <!--ícono de "hamburguesa" o "menú"-->
                    </svg>
                </button>
            </section>
            <div class="flex flex-col items-start mt-3 gap-2 sm:flex-row sm:m-0">
                <button
                    class="text-stone-50 hover:bg-stone-50 w-full text-left px-2 rounded hover:text-stone-50">Blog</button>
                <button class="text-stone-50  w-full text-left px-2 rounded hover:text-stone-50">Docs</button>
                <button
                    class="text-stone-50 hover:bg-stone-50 w-full text-left px-2 rounded hover:text-stone-50">Contacto</button>
            </div>
        </nav>
    </div>
    <!--Fin menu desplegable-->

    <!--carrusel-->
    <div class="relative w-full max-w4xl overflow-hidden rounded-2xl shadow-lg">
        <div class="carousel-track">
            {% for img in imagenes %}
            <img src="{{ img }}" class="w-full h-64 w-96 object-cover" alt="Image {{ loop.index }}">
            {% endfor %}

        </div>
    </div>
    <!--Fin carrusel-->


    pagina-->
    <footer class="bg-gray-900 text-white py-6 mt-10">
        <div class="container mx-auto px-6 text-center">
            <p class="text-sm">&copy; {{ year }} Todos los derechos reservados.</p>
            <p class="text-sm">Desarrollado con ❤️ por <a href="https://tusitio.com" class="underline">Tu Nombre</a></p>
        </div>
    </footer>
    <!-- fin pie de pagina-->
    <script src="{{ url_for('static', filename='js/card.js') }}"></script>
    <script src="{{ url_for('static', filename='js/carrusel.js') }}"></script>
</body>

</html>
